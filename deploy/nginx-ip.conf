##############################################################################
# Nginx config for Cloud PBX — plain HTTP, static public IP
# Use this when you don't have a domain name yet.
#
# Place at:  /etc/nginx/sites-available/cloudpbx
# Enable:    ln -s /etc/nginx/sites-available/cloudpbx /etc/nginx/sites-enabled/cloudpbx
# Test:      nginx -t
# Reload:    systemctl reload nginx
##############################################################################

upstream django_backend {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name _;          # accepts any IP / hostname

    client_max_body_size 50M;

    # ── Static files (Django collectstatic output) ────────────────────────
    location /static/ {
        alias /opt/cloudpbx/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Media files ───────────────────────────────────────────────────────
    location /media/ {
        alias /opt/cloudpbx/backend/media/;
        expires 7d;
    }

    # ── API, admin, XML-cURL, provisioning → gunicorn ────────────────────
    location ~ ^/(api|admin|xml-curl|provision)/ {
        proxy_pass         http://django_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── WebSocket (Django Channels / live dashboard) ──────────────────────
    location /ws/ {
        proxy_pass         http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── React SPA (built with Vite) ───────────────────────────────────────
    location / {
        root /opt/cloudpbx/frontend/dist;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "no-cache";
    }

    location /health/ {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
