##############################################################################
# Nginx configuration for Cloud PBX
# Place at: /etc/nginx/sites-available/cloudpbx
# Enable:   ln -s /etc/nginx/sites-available/cloudpbx /etc/nginx/sites-enabled/
##############################################################################

upstream django_backend {
    server 127.0.0.1:8000 fail_timeout=0;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;   # <- change this

    # SSL - obtain via: certbot --nginx -d your-domain.com
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    client_max_body_size 50M;

    # Static / Media
    location /static/ {
        alias /opt/cloudpbx/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /media/ {
        alias /opt/cloudpbx/backend/media/;
        expires 7d;
    }

    # Frontend SPA (built)
    location / {
        root /opt/cloudpbx/frontend/dist;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    # API, admin, XML-cURL, provision
    location ~ ^/(api|admin|xml-curl|provision)/ {
        proxy_pass         http://django_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket (Django Channels)
    location /ws/ {
        proxy_pass         http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # HOMER (SIP capture) admin UI — reverse-proxied to the loopback-only
    # homer-app. Protected by HOMER's own login; superadmins open it in a new
    # tab from the Cloud PBX sidebar. The sub_filter injects <base href="/homer/">
    # so HOMER's root-built Angular bundle resolves its assets/API under /homer/
    # (survives HOMER package upgrades, unlike editing dist/index.html).
    location = /homer { return 301 /homer/; }
    location /homer/ {
        proxy_pass         http://127.0.0.1:9080/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     ~^/(.*)$ /homer/$1;
        proxy_read_timeout 300s;
        proxy_set_header   Accept-Encoding "";
        sub_filter_types   text/html;
        sub_filter         '<meta charset="utf-8">' '<meta charset="utf-8"><base href="/homer/">';
        sub_filter_once    on;
    }

    location /health/ {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
