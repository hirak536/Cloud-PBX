##############################################################################
# Fail2ban jail configuration for IHS PBX
# Place at: /etc/fail2ban/jail.d/ihspbx.conf
##############################################################################

# ---------------------------------------------------------------------------
# FreeSWITCH SIP brute-force protection (UDP)
# Catches registration scans and credential stuffing via SIP
# ---------------------------------------------------------------------------
[freeswitch-udp]
enabled   = true
port      = 5060,5080
protocol  = udp
filter    = freeswitch
logpath   = /var/log/freeswitch/freeswitch.log
maxretry  = 10
findtime  = 60
bantime   = 3600
action    = iptables-allports[name=freeswitch-udp, protocol=udp]

# ---------------------------------------------------------------------------
# FreeSWITCH SIP brute-force protection (TCP/TLS)
# ---------------------------------------------------------------------------
[freeswitch-tcp]
enabled   = true
port      = 5060,5061,5080,5081
protocol  = tcp
filter    = freeswitch
logpath   = /var/log/freeswitch/freeswitch.log
maxretry  = 10
findtime  = 60
bantime   = 3600
action    = iptables-allports[name=freeswitch-tcp, protocol=tcp]

# ---------------------------------------------------------------------------
# IHS PBX API login brute-force protection
# Catches credential stuffing against the web admin interface
# ---------------------------------------------------------------------------
[ihspbx]
enabled   = true
port      = http,https
protocol  = tcp
filter    = ihspbx-django
logpath   = /var/log/nginx/access.log
maxretry  = 5
findtime  = 300
bantime   = 1800
action    = iptables-multiport[name=ihspbx, port="http,https", protocol=tcp]

# ---------------------------------------------------------------------------
# Recidive jail - escalating bans for repeat offenders
# Bans IPs that have been banned 3+ times in the last day for 1 week
# ---------------------------------------------------------------------------
[recidive]
enabled   = true
logpath   = /var/log/fail2ban.log
banaction = iptables-allports
# 1 week
bantime   = 604800
# 1 day
findtime  = 86400
maxretry  = 3
