# Fail2ban filter for FreeSWITCH SIP authentication failures + call fraud
# Matches /var/log/freeswitch/freeswitch.log
#
# Covers:
#   - REGISTER brute-force: "Can't find user", "Wrong Password", "SIP auth failure"
#   - INVITE toll fraud:    "INVITE from" with auth failure, "407 Proxy Auth" challenges
#
# Log format example:
#   2026-02-27 08:50:29.386374 66.30% [WARNING] sofia_reg.c:3210 Can't find user [111@10.127.127.76] from 87.246.54.153
#   2026-02-27 08:51:00.123456 50.10% [WARNING] sofia_reg.c:3310 SIP auth failure for [1000@pbx.example.com] from [87.246.54.153]
#   2026-02-27 08:51:05.000000 40.00% [WARNING] sofia_reg.c:3456 Wrong Password for user [1000@pbx.example.com] from [87.246.54.153]

[INCLUDES]
before = common.conf

[Definition]
failregex = \[WARNING\] sofia_reg\.c:\d+ Can't find user \[.+?\] from <HOST>$
            \[WARNING\] sofia_reg\.c:\d+ SIP auth (failure|challenge) for \[.+?\] from \[?<HOST>\]?$
            \[WARNING\] sofia_reg\.c:\d+ Wrong Password for user \[?.+?\]? from \[?<HOST>\]?$
            \[WARNING\] sofia_reg\.c:\d+ Registration failed \(\S+\) .+ from \[?<HOST>\]?$
            \[WARNING\] sofia_reg\.c:\d+ .+ Call from .+ \[<HOST>:\d+\] to extension .+ rejected
            \[WARNING\] mod_sofia\.c:\d+ .+\[<HOST>\].+407
            \[NOTICE\] sofia_reg\.c:\d+ .+Failed to auth .+ from <HOST>

ignoreregex =

# --- Notes ---
# maxretry should be low (5-10) since each attempt is a distinct SIP REGISTER/INVITE
# bantime of 1h+ is recommended; persistent scanners warrant 24h+
# Use action = iptables-allports[name=freeswitch, protocol=all] to block all ports not just SIP
