# Fail2ban filter for Cloud PBX API failed login attempts
# Matches nginx access log entries for POST /api/auth/login/ returning 400/401
#
# Nginx access log format (combined):
#   87.246.54.153 - - [27/Feb/2026:08:50:29 +0000] "POST /api/auth/login/ HTTP/1.1" 401 45 "-" "python-requests/2.28.0"
#
# Ensure nginx is configured with:
#   proxy_set_header X-Real-IP $remote_addr;
# so the real client IP appears as the first field in the log.

[INCLUDES]
before = common.conf

[Definition]
failregex = ^<HOST> .+ "POST /api/auth/login/ HTTP/\d\.\d" (400|401) \d+ .+$

ignoreregex =

# --- Notes ---
# maxretry = 5 over findtime = 300s (5 minutes) is a good starting point
# bantime = 1800 (30 min) balances security vs. legitimate users who mistype passwords
# Increase bantime for repeated offenders using fail2ban's recidive jail
